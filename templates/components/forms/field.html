<div class="min-w-0">
  <label for="{{ field.id_for_label }}" class="block text-sm font-bold text-foreground">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-label="required">*</span>{% endif %}</label>
  {{ field }}
  {% if field.errors %}<div class="mt-1.5 space-y-1 text-xs font-medium text-danger" role="alert">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
  {% if field.help_text %}<p class="mt-1.5 text-xs leading-relaxed text-muted">{{ field.help_text }}</p>{% endif %}
</div>
