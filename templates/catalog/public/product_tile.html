<article class="group overflow-hidden rounded-2xl border border-line bg-surface transition hover:border-primary/40 hover:shadow-[0_15px_40px_var(--app-shadow)]">
  <a href="{% url 'catalog:marketplace_detail' product.slug %}" class="block aspect-[4/3] overflow-hidden bg-surface-soft">{% with picture=product.primary_image %}{% if picture %}<img src="{{ picture.image.url }}" alt="{{ picture.alt_text|default:product.name }}" loading="lazy" class="h-full w-full object-contain transition duration-300 group-hover:scale-105">{% endif %}{% endwith %}</a>
  <div class="p-5"><p class="text-[11px] font-bold uppercase tracking-wider text-muted">{{ product.category.name }}</p><h3 class="mt-2 truncate text-base font-extrabold"><a class="hover:text-primary" href="{% url 'catalog:marketplace_detail' product.slug %}">{{ product.name }}</a></h3><p class="mt-1 truncate text-xs text-muted">{{ product.store.name }}</p><p class="mt-3 text-lg font-black text-foreground">{% if product.bdt_price %}৳{{ product.bdt_price|floatformat:2 }}{% else %}Price unavailable{% endif %}</p><a href="{% url 'catalog:marketplace_detail' product.slug %}" class="mt-4 block rounded-xl border border-primary px-4 py-2.5 text-center text-xs font-bold text-primary hover:bg-surface-soft">View product →</a></div>
</article>
