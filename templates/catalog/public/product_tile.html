<article class="group relative flex h-full min-w-0 flex-col overflow-hidden rounded-2xl border border-line bg-surface transition hover:border-primary/40 hover:shadow-[0_15px_40px_var(--app-shadow)]">
  <button type="button" data-marketplace-favorite data-product-id="{{ product.pk }}" data-product-name="{{ product.name }}"
    aria-label="Save {{ product.name }} to wishlist" aria-pressed="false" title="Save to wishlist"
    class="absolute right-3 top-3 z-10 flex size-10 items-center justify-center rounded-full bg-surface text-xl text-foreground shadow-sm transition hover:text-primary focus-visible:outline-2 focus-visible:outline-primary">
    <span data-heart-icon aria-hidden="true">♡</span>
  </button>
  <a href="{% url 'catalog:marketplace_detail' product.slug %}" class="block aspect-[4/3] overflow-hidden bg-surface-soft">{% with picture=product.primary_image %}{% if picture %}<img src="{{ picture.image.url }}" alt="{{ picture.alt_text|default:product.name }}" loading="lazy" class="h-full w-full object-contain transition duration-300 group-hover:scale-105">{% endif %}{% endwith %}</a>
  <div class="flex flex-1 flex-col p-3.5 sm:p-5"><p class="text-[11px] font-bold uppercase tracking-wider text-muted">{{ product.category.name }}</p><h3 class="mt-2 min-h-10 text-sm font-extrabold leading-5 sm:text-base"><a class="hover:text-primary" href="{% url 'catalog:marketplace_detail' product.slug %}">{{ product.name }}</a></h3><p class="mt-1 truncate text-xs text-muted">{{ product.store.name }}</p><p class="mt-auto pt-4 text-lg font-black text-foreground">{% if product.bdt_price %}৳{{ product.bdt_price|floatformat:2 }}{% else %}Price unavailable{% endif %}</p><a href="{% url 'catalog:marketplace_detail' product.slug %}" class="mt-4 block min-h-10 rounded-xl border border-primary px-4 py-2.5 text-center text-xs font-bold text-primary hover:bg-surface-soft">View product →</a></div>
</article>
